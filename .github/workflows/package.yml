name: compressed-payload-firmware
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38
          path: uefi-sheng
          submodules: false
      - name: install tools
        run: brew install dtc llvm lld cmake mtools ninja
      - name: apply compressed payload driver and menu-safe firmware settings
        run: |
          cp device/diagnostics/compressed-initrd/UniXNURamDiskDxe.c UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/
          cp device/diagnostics/compressed-initrd/UniXNURamDiskDxe.inf UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/
          python3 device/diagnostics/compressed-initrd/configure.py
      - uses: actions/cache@v4
        with:
          path: UniXNU/out/sheng/*/*/tree/.cache/firmware/sheng
          key: sheng-firmware-inputs-v2
      - name: build firmware only
        working-directory: UniXNU
        run: ./unixnu build firmware -D ../device --uefi ../uefi-sheng
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-payload-firmware
          path: uefi-sheng/Build/shengPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compressed-firmware-logs
          path: UniXNU/out/**/logs/*.log
